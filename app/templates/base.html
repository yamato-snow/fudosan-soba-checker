<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}不動産相場チェッカー{% endblock %}</title>
  <!-- HTMX は CDN 参照（自分専用ローカルツールのため。オフラインで使うなら app/static/ に置いて差し替える） -->
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    :root { color-scheme: light dark; --line: #d8d8d8; --muted: #666; --accent: #16607a; }
    body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 0; padding: 1.5rem;
           max-width: 960px; margin-inline: auto; line-height: 1.7; }
    h1 { font-size: 1.3rem; }
    nav a { margin-right: 1rem; color: var(--accent); }
    form.card { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                border: 1px solid var(--line); border-radius: 8px; padding: 1rem; }
    label { display: block; font-size: .85rem; color: var(--muted); }
    input, select { width: 100%; padding: .45rem; box-sizing: border-box; }
    button { padding: .55rem 1.2rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { border-bottom: 1px solid var(--line); padding: .35rem .5rem; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
    .muted { color: var(--muted); font-size: .85rem; }
    .result { border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    .ratio { font-size: 1.8rem; font-weight: 700; }
    .band { display: inline-block; padding: .1rem .6rem; border-radius: 999px; border: 1px solid var(--line); }
    .band-割安 { background: #e3f4e6; } .band-適正 { background: #eef1f4; } .band-割高 { background: #fbe7e7; }
    .error { color: #a33; }
    .scroll { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>不動産相場チェッカー</h1>
  <nav class="muted">
    <a href="/">割安判定</a><a href="/transactions">取引データ一覧</a>
    <a href="/rent">賃料相場</a><a href="/rent/listings">賃料事例</a>
    <span>データ出典: 国土交通省 不動産情報ライブラリ（取引価格情報・成約価格情報）／賃料は手入力・CSV</span>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
